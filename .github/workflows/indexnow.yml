name: IndexNow ping
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # give Vercel time to finish the production deploy
      - run: sleep 240
      - run: node scripts/indexnow.mjs
        continue-on-error: true
